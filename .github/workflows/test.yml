name: Test

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: |
          npm run compile
          git diff --exit-code

  test:
    needs: check

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

      - name: Prepare a directory structure
        shell: bash
        run: |
          mkdir -p path/to/artifact1
          mkdir -p path/to/artifact2
          echo hello > path/to/artifact1/hello.txt
          echo world > path/to/artifact2/world.txt
          echo hello > path/to/artifact1/hello.tsv
          echo world > path/to/artifact2/world.tsv
          echo hello > path/to/artifact1/hello.csv
          echo world > path/to/artifact2/world.csv

      - name: Basic usage
        uses: ./
        with:
          connection-string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          container: 'azblob-upload-artifact'
          name: '${{ matrix.os }}/azblob-upload-artifact1'
          path: 'README.md'

      - name: Upload with path (file)
        uses: ./
        with:
          connection-string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          container: 'azblob-upload-artifact'
          name: '${{ matrix.os }}/azblob-upload-artifact2'
          path: 'path/to/artifact1/hello.txt'

      - name: Upload with path (directory)
        uses: ./
        with:
          connection-string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          container: 'azblob-upload-artifact'
          name: '${{ matrix.os }}/azblob-upload-artifact3'
          path: 'path/to/artifact2'

      # A blob whose name only starts with the same string must survive cleanup.
      # The container is shared, so a wider cleanup would delete other artifacts.
      - name: Put a blob next to the one to be cleaned up
        if: runner.os == 'Linux'
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          az storage blob upload --only-show-errors --overwrite \
            -c azblob-upload-artifact -f README.md \
            -n '${{ matrix.os }}/azblob-upload-artifact3x/keep.md' > /dev/null

      - name: Upload with path (directory, overwrite)
        uses: ./
        with:
          connection-string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          container: 'azblob-upload-artifact'
          name: '${{ matrix.os }}/azblob-upload-artifact3'
          path: 'path/to/artifact1'
          cleanup: 'true'

      - name: Check that cleanup removed only the blobs under the name
        if: runner.os == 'Linux'
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          list() {
            az storage blob list --only-show-errors -c azblob-upload-artifact \
              --prefix "$1" --query '[].name' -o tsv | sort | tr '\n' ' '
          }
          actual=$(list '${{ matrix.os }}/azblob-upload-artifact3/')
          expected='${{ matrix.os }}/azblob-upload-artifact3/hello.csv ${{ matrix.os }}/azblob-upload-artifact3/hello.tsv ${{ matrix.os }}/azblob-upload-artifact3/hello.txt '
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected blobs after cleanup: $actual"
            exit 1
          fi
          neighbor=$(list '${{ matrix.os }}/azblob-upload-artifact3x/')
          if [ "$neighbor" != '${{ matrix.os }}/azblob-upload-artifact3x/keep.md ' ]; then
            echo "::error::Cleanup removed a blob outside the name: $neighbor"
            exit 1
          fi

      - name: Upload with path (wildcards)
        uses: ./
        with:
          connection-string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          container: 'azblob-upload-artifact'
          name: '${{ matrix.os }}/azblob-upload-artifact4'
          path: 'path/**/*.+(txt|tsv)'
